[project]
name = "dibimbing-scraping"
version = "0.1.0"
description = "Building Scalable Data Pipelines - Web Scraping & API Integration (Hands-on Data Engineering)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "selenium>=4.27",
    "pandas>=2.2",
]

# Optional dependency for PostgreSQL (Step 8, Postgres version).
# Install with:  uv sync --extra postgres
[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
]
# To run the walkthrough notebook:  uv sync --extra notebook
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]
# For the news article parsing notebook (notebooks/misc):  uv sync --extra news
news = [
    "newspaper4k>=0.9.3",
]
# Additional NLP features (keywords & summaries) for newspaper:  uv sync --extra news-nlp
news-nlp = [
    "newspaper4k>=0.9.3",
    "nltk>=3.8",
]
# For the e-commerce notebook (extruct + price-parser + Scrapy):  uv sync --extra ecommerce
ecommerce = [
    "extruct>=0.16",
    "price-parser>=0.3.4",
    "scrapy>=2.11",
]
# Page object pattern (optional, requires a Scrapy project setup):  uv sync --extra ecommerce-advanced
ecommerce-advanced = [
    "scrapy>=2.11",
    "scrapy-poet>=0.24",
    "zyte-common-items>=0.26",
]
# Anti-bot security lab (notebooks/misc/scrapy_real_case): TLS impersonation, etc.
# For security EDUCATION (red/blue team).  uv sync --extra security
security = [
    "scrapy>=2.11",
    "price-parser>=0.3.4",
    "curl-cffi>=0.7",
    "scrapy-impersonate>=0.5",
]

[tool.uv]
# No special configuration; the uv defaults are enough for the class.
