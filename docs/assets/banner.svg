<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#16204a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0d99a"/>
      <stop offset="100%" stop-color="#c9a24a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#c9a24a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c9a24a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <text x="64" y="96" fill="#c9a24a" font-size="20" font-weight="600" letter-spacing="3">HANDS-ON DATA EXTRACTION</text>
  <text x="60" y="170" fill="url(#title)" font-size="60" font-weight="800">Web Scraping &amp; API Integration</text>
  <text x="64" y="214" fill="#c7d0e6" font-size="24" font-weight="500">Web Scraping (BeautifulSoup, Selenium, XPath) &amp; API Integration</text>
  <g font-size="16" font-weight="600">
    <rect x="64" y="248" width="150" height="40" rx="20" fill="#161f3d" stroke="#25325c"/>
    <text x="139" y="273" fill="#e7ecf6" text-anchor="middle">BeautifulSoup</text>
    <rect x="230" y="248" width="120" height="40" rx="20" fill="#161f3d" stroke="#25325c"/>
    <text x="290" y="273" fill="#e7ecf6" text-anchor="middle">Selenium</text>
    <rect x="366" y="248" width="160" height="40" rx="20" fill="#161f3d" stroke="#25325c"/>
    <text x="446" y="273" fill="#e7ecf6" text-anchor="middle">API + pandas</text>
    <rect x="542" y="248" width="180" height="40" rx="20" fill="#161f3d" stroke="#25325c"/>
    <text x="632" y="273" fill="#e7ecf6" text-anchor="middle">SQLite / Postgres</text>
    <rect x="738" y="248" width="90" height="40" rx="20" fill="#161f3d" stroke="#25325c"/>
    <text x="783" y="273" fill="#e7ecf6" text-anchor="middle">uv</text>
  </g>
</svg>
