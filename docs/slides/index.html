## Scraping vs API

<div class="two-col">
<div>

**Use an API when one exists**
- Stable, documented, structured (JSON)
- Faster, less likely to break
- Usually the *intended* way to get data

</div>
<div>

**Scrape the HTML when**
- No API is available
- Data only lives in the page
- One-off / exploratory tasks

</div>
</div>

> Golden rule: **check for a hidden/official API first** (open DevTools &rarr; Network &rarr; XHR). Many "scraping" problems are really API problems.

## Static scraping: requests + BeautifulSoup

```python
import requests
from bs4 import BeautifulSoup

resp = requests.get("https://books.toscrape.com/")
resp.encoding = "utf-8"                      # avoid £ -> Â£
soup = BeautifulSoup(resp.text, "lxml")

for card in soup.select("article.product_pod"):
    title = card.h3.a["title"]
    price = card.select_one("p.price_color").text
    print(title, price)
```

Three things: **fetch** (requests) &rarr; **parse** (BeautifulSoup) &rarr; **select** (CSS).

## Selecting elements: BeautifulSoup vs XPath

| Goal | BeautifulSoup | XPath (lxml) |
|---|---|---|
| By id | `find(id="x")` | `//*[@id="x"]` |
| By class | `find_all(class_="card")` | `//*[contains(@class,"card")]` |
| By attribute | `find(attrs={"aria-label":"Next"})` | `//*[@aria-label="Next"]` |
| Get href | `a["href"]` | `//a/@href` |
| Starts-with | `re.compile(r"^/product/")` | `starts-with(@href,"/product/")` |
| Text contains | `string=re.compile("Sale")` | `//*[contains(text(),"Sale")]` |

<p class="small">Full walkthrough (easy &rarr; hard): <code>notebooks/beautifulsoup_vs_xpath.ipynb</code></p>

---

## Token-safe class matching (gotcha)

`contains(@class,"product")` also matches `product-list`. Match the **whole token**:

```python
# XPath: match the exact class token "product"
'//div[contains(concat(" ", normalize-space(@class), " "), " product ")]'
```

> Substring matching is the #1 source of "why did it grab the wrong element?"

## Dynamic pages: Selenium

When content is rendered by JavaScript, `requests` sees an empty shell. Drive a real browser:

```python
from selenium.webdriver.support.ui import WebDriverWait
from selenium.webdriver.support import expected_conditions as EC
from selenium.webdriver.common.by import By

WebDriverWait(driver, 10).until(
    EC.presence_of_element_located((By.CSS_SELECTOR, ".quote"))
)
```

**Use explicit waits, not `time.sleep()`** — faster *and* more reliable.

Note:
`time.sleep` is both too slow (you wait the full time) and too fragile (sometimes not long enough). WebDriverWait polls until the condition is true.

## Scrapy: why async matters

```python
custom_settings = {
    "CONCURRENT_REQUESTS": 16,     # 16 requests in flight
    "AUTOTHROTTLE_ENABLED": True,  # be polite automatically
    "ROBOTSTXT_OBEY": True,
}
```

Same 240 items, just changing concurrency:

| Concurrency | Time |
|---|---|
| 1 (synchronous) | ~1.0&times; (baseline) |
| 16 (async) | **~2&times; faster** |

> Scrapy's event loop overlaps network waits — the CPU isn't the bottleneck, the *network* is.

## Security lab: anti-bot (Red vs Blue)

Real e-commerce sites fight scrapers. To **defend**, you must understand the **attack**.

A real escalation ladder against a live site:

| Lvl | Red-team technique | Result |
|---|---|---|
| 0 | plain `requests` (Python UA) | **403 blocked** |
| 1 | full browser headers | sometimes passes |
| 2 | TLS fingerprint spoofing (JA3) | sometimes passes |
| 3 | warm-up cookie + TLS impersonate | **gets through** |

<p class="small">Lab notebook: <code>notebooks/misc/scrapy_real_case.ipynb</code> (with a glossary)</p>

Note:
This is for defensive security education. We only touch public data, minimal requests, and the point is to learn how to PREVENT each technique.

---

## Key terms (glossary)

- **UA (User-Agent)** — string a client sends to identify itself
- **WAF** — Web Application Firewall; filters malicious / bot traffic
- **TLS fingerprint (JA3/JA4)** — signature of *how* a client negotiates HTTPS; Python looks different from Chrome
- **Cookie / warm-up** — visiting a page first to obtain a bot-management cookie
- **Headless browser** — a real browser with no visible window

---

## Blue team: defense in depth

| Attack | Defense |
|---|---|
| Fake User-Agent | header anomaly detection |
| TLS impersonation | **JA3/JA4 fingerprinting** |
| Cookie warm-up | **managed / JS challenge** |
| Headless browser | `navigator.webdriver`, behavior biometrics |
| Proxy rotation, scale | rate limiting, IP reputation |
| Everything | **honeytokens**, monitoring & alerting |

> No silver bullet — **layers** raise the attacker's cost.

## Ethics & `robots.txt`

```python
import urllib.robotparser as rp
r = rp.RobotFileParser()
r.set_url("https://example.com/robots.txt"); r.read()
r.can_fetch("*", "/some/path")   # True / False
```

- **"Can scrape" &ne; "may scrape."** Respect `robots.txt` + Terms of Service.
- Identify yourself (User-Agent), rate-limit, scrape off-peak.
- Prefer official APIs / licensed data for production.

## Transform & Load

```python
import pandas as pd, sqlite3

df = pd.DataFrame(rows)
df["price"] = df["price"].str.replace("£", "").astype(float)
df = df.drop_duplicates()

conn = sqlite3.connect("data/ecommerce.db")
df.to_sql("products", conn, if_exists="replace", index=False)
```

Clean &rarr; validate types &rarr; persist to **SQLite** (or PostgreSQL).
