[project]
name = "dibimbing-scraping"
version = "0.1.0"
description = "Building Scalable Data Pipelines - Web Scraping & API Integration (Hands-on Data Engineering)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "selenium>=4.27",
    "pandas>=2.2",
]

# Dependency opsional untuk PostgreSQL (Langkah 8 versi Postgres).
# Install dengan:  uv sync --extra postgres
[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
]
# Untuk menjalankan notebook walkthrough:  uv sync --extra notebook
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]
# Untuk notebook parsing artikel berita (notebooks/misc):  uv sync --extra news
news = [
    "newspaper4k>=0.9.3",
]
# Tambahan fitur NLP (keyword & ringkasan) untuk newspaper:  uv sync --extra news-nlp
news-nlp = [
    "newspaper4k>=0.9.3",
    "nltk>=3.8",
]

[tool.uv]
# Tidak ada konfigurasi khusus; default uv sudah cukup untuk kelas.
